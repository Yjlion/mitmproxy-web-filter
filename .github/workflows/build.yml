name: build-archives

on:
  push:
    tags: ["v*"]
  pull_request:
    # Validate the build matrix (incl. linux-aarch64) and the multi-arch Docker
    # build on PRs. These runs build only — they never attach a Release or push
    # an image (see the gated steps below).
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create (e.g. v0.1.7)'
        required: true

permissions:
  contents: write   # needed to attach archives to a Release on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64   # Raspberry Pi (64-bit OS), ARM servers
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Refresh site category blocklists
        shell: bash
        run: |
          # Populate categories/ so the release archive ships up-to-date lists.
          # Non-fatal: if the upstream source is down, fall back to whatever is
          # committed in the repo rather than failing the whole release.
          bash scripts/update_categories.sh || echo "::warning::update_categories failed; shipping committed category lists"
          mkdir -p categories   # ensure the dir exists for the copy step even if the fetch failed

      - name: Build self-contained archive
        shell: bash
        env:
          PY_VERSION: "3.12"
          APPDIR: web-filter-proxy
        run: |
          set -euxo pipefail

          # 1) Get a relocatable standalone CPython (python-build-standalone).
          uv python install "$PY_VERSION"
          PYEXE="$(uv python find "$PY_VERSION")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT="$(dirname "$PYEXE")"          # python.exe sits at the install root
            RTPY="runtime/python.exe"
          else
            ROOT="$(dirname "$(dirname "$PYEXE")")"   # <root>/bin/python3
            RTPY="runtime/bin/python3"
          fi

          # 2) Copy the runtime into ./runtime and install deps into it.
          #    -L dereferences symlinks: uv's bin/python3 can be an absolute
          #    symlink back to the managed install, which would otherwise make
          #    the "copy" still use the original (externally-managed) stdlib.
          rm -rf runtime && cp -rL "$ROOT" runtime
          # uv's standalone Python is marked externally-managed (PEP 668); drop the
          # marker so pip may install our dependencies into the bundled runtime.
          find runtime -name 'EXTERNALLY-MANAGED' -delete || true
          "$RTPY" -m ensurepip --upgrade
          "$RTPY" -m pip install --upgrade pip
          "$RTPY" -m pip install -r requirements.txt

          # 3) Assemble the distribution directory.
          rm -rf dist && mkdir -p "dist/$APPDIR"
          cp -r proxy management shared scripts config policies categories \
                requirements.txt CLAUDE.md README.md start.sh start.bat \
                install.sh install.bat "dist/$APPDIR/"
          mv runtime "dist/$APPDIR/runtime"
          # start from sane defaults; never ship a real (secret-bearing) settings.json
          cp config/settings.example.json "dist/$APPDIR/config/settings.json"
          mkdir -p "dist/$APPDIR/certs" "dist/$APPDIR/logs"
          # Record the release tag so the app can report its version (the archive
          # ships without a .git directory, so git describe is unavailable there).
          echo "${{ inputs.tag_name || github.ref_name }}" > "dist/$APPDIR/VERSION"
          # strip caches
          find "dist/$APPDIR" -name '__pycache__' -type d -prune -exec rm -rf {} + || true

          # 4) Archive (.tar.gz on Linux, .zip on Windows).
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path 'dist/$APPDIR' -DestinationPath 'web-filter-proxy-${{ matrix.target }}.zip' -Force"
          else
            tar -C dist -czf "web-filter-proxy-${{ matrix.target }}.tar.gz" "$APPDIR"
          fi
          ls -lh web-filter-proxy-${{ matrix.target }}.* || true

      - name: Smoke-test the bundled runtime (imports)
        shell: bash
        run: |
          set -eux
          if [ "$RUNNER_OS" = "Windows" ]; then RTPY="dist/web-filter-proxy/runtime/python.exe"; else RTPY="dist/web-filter-proxy/runtime/bin/python3"; fi
          "$RTPY" -c "import mitmproxy, fastapi, uvicorn, httpx, dns, nudenet, PIL, bs4, multipart; print('bundled imports OK')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-filter-proxy-${{ matrix.target }}
          path: web-filter-proxy-${{ matrix.target }}.*

      - name: Attach to Release (tag builds and manual releases)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: web-filter-proxy-${{ matrix.target }}.*

  # Build a .deb package for each Linux target and attach it to the release.
  # The archive job must complete first so we can reuse its bundled categories.
  deb:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh site category blocklists
        shell: bash
        run: |
          bash scripts/update_categories.sh || echo "::warning::update_categories failed; shipping committed category lists"
          mkdir -p categories

      - name: Build .deb package
        shell: bash
        run: |
          set -euxo pipefail
          TAG="${{ inputs.tag_name || github.ref_name }}"
          bash scripts/build_deb.sh "$TAG"
          ls -lh webfilter-proxy_*.deb

      - name: Smoke-test the .deb (install + import check)
        shell: bash
        run: |
          set -eux
          DEB="$(ls webfilter-proxy_*.deb)"
          sudo dpkg -i "$DEB"
          # Verify the bundled venv can import all required modules.
          /opt/webfilter-proxy/venv/bin/python3 -c \
            "import mitmproxy, fastapi, uvicorn, httpx, dns, nudenet, PIL, bs4, multipart; print('deb imports OK')"
          sudo dpkg -r webfilter-proxy

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: webfilter-proxy-deb-${{ matrix.target }}
          path: webfilter-proxy_*.deb

      - name: Attach .deb to Release (tag builds and manual releases)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: webfilter-proxy_*.deb

  # Build the single-container image and publish it to the GitHub Container
  # Registry (ghcr.io/<owner>/<repo>) on every release tag.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Refresh site category blocklists
        shell: bash
        run: |
          bash scripts/update_categories.sh || echo "::warning::update_categories failed; shipping committed category lists"
          mkdir -p categories

      - name: Set up QEMU
        # Enables cross-building the linux/arm64 image (Raspberry Pi) on the
        # amd64 runner via emulation.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # PRs build only and never push, so skip login (and avoid needing the
        # registry token on PRs from forks).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name, so the mixed-case owner
          # (github.repository) resolves to a valid ghcr.io reference.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name || github.ref_name }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push only on release tags / manual dispatch; PR runs validate the
          # multi-arch build without publishing.
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ inputs.tag_name || github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
